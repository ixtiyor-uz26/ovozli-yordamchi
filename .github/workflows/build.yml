name: APK yig'ish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK yig'ish
        run: gradle :app:assembleRelease --no-daemon

      - name: Faylni nomlash
        run: cp app/build/outputs/apk/release/app-release.apk OvozliYordamchi.apk

      - name: Yuklab olish uchun joylash (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ovozli yordamchi v1.0.${{ github.run_number }}
          body: "Telefoningizga yuklab olib o'rnating: OvozliYordamchi.apk"
          files: OvozliYordamchi.apk
